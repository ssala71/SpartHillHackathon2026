# =============================================================================
# Pytest discovery and import configuration
#
# Run pytest from the project root. The application uses a src/ layout; adding it
# to the Python import path makes `app` importable without installing a package.
# Restrict collection to tests/ so runtime modules, build artifacts, and unrelated
# files are not treated as test suites. This file changes no AWS runtime behavior.
# =============================================================================
[pytest]
# Resolve imports such as app.service against the deployable source directory.
pythonpath = src
# Collect only the explicitly maintained unit/API/adapter test suite.
testpaths = tests
